[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemforge"
version = "0.2.0"
description = "Stem splitting + beat slicing pipeline for Ableton Live IDM production"
requires-python = ">=3.11"
dependencies = [
    # Core: lightweight only. No torch, no transformers.
    # librosa DSP + CLI + manifest.
    "requests>=2.31.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Local Demucs stem separation (heavy — pulls torch).
native = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "demucs>=4.0.1",
]
# Neural downbeat detection via beat-this transformer (requires torch).
beat = [
    "beat-this>=1.1.0",
    "torch>=2.1.0",
]
# Audio classification (genre via CLAP, instruments via AST).
analyzer = [
    "transformers>=4.40",
    "laion-clap>=1.1",
]
# Modal cloud GPU backend.
modal = [
    "modal>=0.60",
]
# EP-133 SysEx exporter (live MIDI upload to the K.O. II) + the legacy
# Playwright exporter (drives TE Sample Tool via browser).
ep133 = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "playwright>=1.45",
]
# ONNX Runtime + conversion tooling (required for native M4L binary per PIVOT).
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxconverter-common>=1.14",
    "optimum[onnxruntime]>=1.20",
    "onnxscript>=0.1",
]
# Everything above + test/lint/build tooling.
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyinstaller>=6.5",
]
# Deprecated alias for `native` — kept for backward compatibility.
local = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "demucs>=4.0.1",
]

[project.scripts]
stemforge = "stemforge.cli:cli"
sf-remote = "tools.sf_remote:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stemforge*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep current style permissive — project uses multi-import lines.
ignore = ["E401", "E402", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Hardening Stream B.4 — opt-in marker for tests that drive a live Ableton
    # session (or any out-of-CI integration). Default-skipped; opt in with
    #   STEMFORGE_LIVE=1 uv run pytest -m live
    # See `tests/conftest.py` for the auto-skip behavior.
    "live: requires Ableton Live (or other dev-Mac integration); default-skip",
    # Hardening Stream E (2026-05-08) — canonical real-world tempo regression
    # tests. Auto-skipped when source files at /private/tmp/phase3_inputs/
    # are missing. See tests/fixtures/known_tempos.py and
    # tests/test_canonical_tempos.py.
    "has_phase3_inputs: requires /private/tmp/phase3_inputs/*.wav; auto-skip",
]

[tool.mypy]
# Pragmatic defaults — the v0.x codebase has accumulated ~280 strict-mypy
# errors and ~113 default-mypy errors that aren't worth fixing in one go.
# CI does NOT enforce mypy yet (see .github/workflows/ci.yml comment).
# Pre-commit runs mypy locally on changed files only; that's the current
# ratchet. See memory `project_stemforge_mypy_debt` for the cleanup plan.
python_version = "3.11"
ignore_missing_imports = true        # silences soundfile/yaml/mido stubs
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
