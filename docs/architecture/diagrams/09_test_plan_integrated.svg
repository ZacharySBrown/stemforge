<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" font-family="Inter, system-ui, sans-serif" text-rendering="optimizeLegibility">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a85ff"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
    <style>
      .title       { font-size: 28px; font-weight: 600; fill: #1a1a1a; }
      .subhead     { font-size: 14px; fill: #666666; }
      .col-label   { font-size: 12px; fill: #666666; letter-spacing: 0.5px; }
      .phase-num   { font-size: 22px; font-weight: 700; fill: #fafaf7; }
      .phase-title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
      .phase-sub   { font-size: 12px; fill: #666666; }
      .box-title   { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .box-sub     { font-size: 11px; fill: #666666; }
      .test-name   { font-size: 12px; fill: #1a1a1a; font-family: "IBM Plex Mono", monospace; }
      .test-name-ok    { font-size: 12px; fill: #3aaa6e; font-family: "IBM Plex Mono", monospace; font-weight: 600; }
      .test-name-todo  { font-size: 12px; fill: #999999; font-family: "IBM Plex Mono", monospace; font-style: italic; }
      .body        { font-size: 13px; fill: #1a1a1a; }
      .mono        { font-family: "IBM Plex Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .code-sm     { font-family: "IBM Plex Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #1a1a1a; }
      .code-accent { font-family: "IBM Plex Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #3a85ff; font-weight: 600; }
      .annot-warn  { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #e85d3a; font-weight: 500; }
      .annot-ok    { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: #3aaa6e; font-weight: 500; }
      .tier-tag    { font-size: 10px; font-weight: 600; fill: #fafaf7; letter-spacing: 0.5px; }
      .input-box   { fill: #fafaf7; stroke: #1a1a1a; stroke-width: 1.5; }
      .stage-box   { fill: #dbeaff; stroke: #3a85ff; stroke-width: 1.5; }
      .ok-box      { fill: #dcf2e4; stroke: #3aaa6e; stroke-width: 1.5; }
      .panel-box   { fill: #f0efe9; stroke: #999999; stroke-width: 1; stroke-dasharray: 4 3; }
      .warn-box    { fill: #ffe5dc; stroke: #e85d3a; stroke-width: 1.5; }
      .phase-circle{ fill: #1a1a1a; }
    </style>
  </defs>

  <rect width="1400" height="950" fill="#fafaf7"/>

  <text x="48" y="50" class="title">integrated test plan</text>
  <text x="48" y="74" class="subhead">5 phases composed from one synth fixture spine. ✓ shipped, ◉ partial, ○ planned. tier targets in time budgets.</text>

  <!-- Synth fixture spine (top) -->
  <g transform="translate(48, 100)">
    <rect width="1304" height="92" rx="12" class="ok-box"/>
    <text x="20" y="28" class="phase-title">central spine: synth fixture (phase 1 prerequisite)</text>
    <text x="20" y="48" class="box-sub">deterministic 8-bar 4/4 stereo loop @ 120 bpm — kick on 1+3, snare on 2+4, hihat on eighths, sub-bass A1, vocals as sine-stack on 4-bar phrase, other as karplus-strong pluck.</text>
    <text x="20" y="68" class="code-sm">tests/fixtures/synth_song.py :: make_synth_song(seed=0, bpm=120, bars=8) -&gt; SynthSongFixture</text>
    <text x="20" y="84" class="annot-ok">✓ ground truth: every stem, every beat, every bar boundary known by construction. zero copyright. byte-deterministic.</text>
  </g>

  <!-- Phase 1 (foundation) -->
  <g transform="translate(48, 220)">
    <circle cx="20" cy="20" r="20" class="phase-circle"/>
    <text x="20" y="27" text-anchor="middle" class="phase-num">1</text>
    <text x="60" y="18" class="phase-title">foundation</text>
    <text x="60" y="36" class="phase-sub">tier 1+3 · ~1 day · prereq for everything else</text>
  </g>
  <g transform="translate(48, 270)">
    <rect width="630" height="100" rx="10" class="panel-box"/>
    <text x="16" y="24" class="box-title">deliverables</text>
    <text x="16" y="44" class="test-name">tests/fixtures/synth_song.py + tests/conftest.py session fixture</text>
    <text x="16" y="62" class="test-name">tests/js_mocks/max_api.js → scriptable mock LiveAPI (liveTree dict)</text>
    <text x="16" y="80" class="test-name">tests/test_js_bridge.py glob-discovery for new *.test.js</text>
    <text x="16" y="96" class="annot-ok">○ status: planned — none of the synth fixture exists yet</text>
  </g>

  <!-- Phase 2 (Python pipeline) -->
  <g transform="translate(48, 390)">
    <circle cx="20" cy="20" r="20" class="phase-circle"/>
    <text x="20" y="27" text-anchor="middle" class="phase-num">2</text>
    <text x="60" y="18" class="phase-title">python / core pipeline</text>
    <text x="60" y="36" class="phase-sub">tier 2 · ~3 days · &lt;60s synth-fixture suite</text>
  </g>
  <g transform="translate(48, 440)">
    <rect width="630" height="216" rx="10" class="ok-box"/>
    <text x="16" y="24" class="box-title">test files</text>
    <text x="16" y="44" class="test-name-ok">✓ tests/test_tempo_reconciler.py  (17 mocked-detector tests, factor-ratio + tiebreaker + librosa fallback)</text>
    <text x="16" y="62" class="test-name-ok">✓ tests/test_prechop.py  (loop region math, pad_pre/pad_post split)</text>
    <text x="16" y="80" class="test-name-ok">✓ tests/test_pipelines.py  (yaml loading + run_post_split_steps)</text>
    <text x="16" y="98" class="test-name-ok">✓ tests/test_beat_detect.py  (beat-this fallback to librosa)</text>
    <text x="16" y="116" class="test-name-ok">✓ tests/test_manifest_schema.py  (SampleMeta/BatchManifest)</text>
    <text x="16" y="134" class="test-name-todo">○ tests/test_backends_demucs.py  (synth → demucs → spectral correlation per stem)</text>
    <text x="16" y="152" class="test-name-todo">○ tests/test_curation_v2.py  (parametrized over [max-diversity, rhythm-taxonomy, sectional])</text>
    <text x="16" y="170" class="test-name-todo">○ tests/test_drum_separator.py  (larsnet substems + spectral centroid bands)</text>
    <text x="16" y="188" class="test-name-todo">○ tests/test_e2e_pipeline.py @slow  (synth → split → forge → export-song)</text>
    <text x="16" y="206" class="annot-ok">cross-cutting: ✓ tools/audit_resampling.py — walks any forged track, asserts wav metadata matches manifest claims</text>
  </g>

  <!-- Phase 3 (JS sandbox) -->
  <g transform="translate(48, 680)">
    <circle cx="20" cy="20" r="20" class="phase-circle"/>
    <text x="20" y="27" text-anchor="middle" class="phase-num">3</text>
    <text x="60" y="18" class="phase-title">m4l js sandbox</text>
    <text x="60" y="36" class="phase-sub">tier 3 · ~3 days · &lt;5s suite via node-vm</text>
  </g>
  <g transform="translate(48, 730)">
    <rect width="630" height="160" rx="10" class="panel-box"/>
    <text x="16" y="24" class="box-title">test files</text>
    <text x="16" y="44" class="test-name-todo">○ tests/js_mocks/test_session_loader.test.js  (applyCurationV2Clip)</text>
    <text x="16" y="62" class="test-name-todo">○ tests/js_mocks/test_arrangement_loader.test.js  (warping=0, length=lengthBeats, marker units in seconds)</text>
    <text x="16" y="80" class="test-name-todo">○ tests/js_mocks/test_clip_export.test.js  (sf_clip_export → m4l_export_clips.py contract)</text>
    <text x="16" y="98" class="test-name-todo">○ tests/js_mocks/run_all.js (aggregator, single subprocess call)</text>
    <text x="16" y="124" class="annot-ok">honest brittleness: mock LiveAPI cannot reproduce live's deferred-call semantics or ghost-method behavior precisely.</text>
    <text x="16" y="142" class="annot-ok">tier 4 covers what tier 3 can't.</text>
  </g>

  <!-- Phase 4 (Live integration, opt-in) -->
  <g transform="translate(700, 220)">
    <circle cx="20" cy="20" r="20" fill="#e85d3a"/>
    <text x="20" y="27" text-anchor="middle" class="phase-num">4</text>
    <text x="60" y="18" class="phase-title">live integration (opt-in)</text>
    <text x="60" y="36" class="phase-sub">tier 4 · ~3-5 days · pytest -m live · NEVER ci gate</text>
  </g>
  <g transform="translate(700, 270)">
    <rect width="652" height="216" rx="10" class="warn-box"/>
    <text x="16" y="24" class="box-title">filesystem side-channel + small osc subpatch</text>
    <text x="16" y="42" class="box-sub">primary strategy: M4L writes to ~/stemforge/logs/, ~/Desktop/snapshot.json, exports/, curated/manifest.json.</text>
    <text x="16" y="60" class="box-sub">tests poke sf_settings dict via osc, watch filesystem for expected outputs.</text>
    <text x="16" y="84" class="test-name-todo">○ tests/integration/conftest.py  (live_session fixture: probe live + ready.flag)</text>
    <text x="16" y="102" class="test-name-todo">○ tests/integration/test_live_session.py  (4 round-trips: forge / session-load / arrangement-load / arrangement-read)</text>
    <text x="16" y="124" class="box-sub">applescript ui control documented as fallback only — too brittle to gate ci.</text>
    <text x="16" y="148" class="annot-warn">⚠ live is not headless — bootstrap cost is high (live + .als + osc subpatch + ready signal).</text>
    <text x="16" y="166" class="annot-warn">⚠ live version drift will break this. mitigation: pin in tests/integration/README.md.</text>
    <text x="16" y="190" class="annot-ok">✓ honest tradeoff: if you skip phase 4, the plan still has merit. tier 3 covers most regressions.</text>
  </g>

  <!-- Phase 5 (device matrix) -->
  <g transform="translate(700, 510)">
    <circle cx="20" cy="20" r="20" class="phase-circle"/>
    <text x="20" y="27" text-anchor="middle" class="phase-num">5</text>
    <text x="60" y="18" class="phase-title">device export matrix</text>
    <text x="60" y="36" class="phase-sub">tier 2 · ~3 days · golden-fixture-driven</text>
  </g>
  <g transform="translate(700, 560)">
    <rect width="652" height="330" rx="10" class="stage-box"/>
    <text x="16" y="24" class="box-title">DeviceProfile refactor + 3 × 4 grid</text>
    <text x="16" y="42" class="box-sub">subclass AbstractExporter w/ DeviceProfile dataclass (~30 lines per device).</text>
    <text x="16" y="60" class="box-sub">drop 4 fixture dirs: tests/fixtures/exports/&lt;device&gt;/{session,session_bounce,arrangement_locators,arrangement_bounce}/</text>
    <text x="16" y="84" class="test-name-todo">○ tests/exporters/conftest.py @parametrize device_profile([ep133, spdsx_pro, koala])</text>
    <text x="16" y="102" class="test-name-todo">○ tests/exporters/test_export_session_view.py  (flavor a)</text>
    <text x="16" y="120" class="test-name-todo">○ tests/exporters/test_export_session_bounce.py  (flavor b)</text>
    <text x="16" y="138" class="test-name-todo">○ tests/exporters/test_export_arrangement_locators.py  (flavor c)</text>
    <text x="16" y="156" class="test-name-todo">○ tests/exporters/test_export_arrangement_bounce.py @skip  (flavor d)</text>
    <text x="16" y="180" class="annot-ok">expected per-cell asserts (excerpt):</text>
    <text x="16" y="200" class="box-sub">  ep-133 (a): 4×12 pad layout, .ppak byte-equal to golden, sidecars present, bpm in pad metadata.</text>
    <text x="16" y="218" class="box-sub">  ep-133 (b): bounced wavs A01..D12, correct trim, sidecars match BatchManifest, .ppak round-trips.</text>
    <text x="16" y="236" class="box-sub">  ep-133 (c): scenes count = locator count, scene→pad mapping per song_resolver, time sig carried.</text>
    <text x="16" y="254" class="box-sub">  spd-sx (all): wfm kit produced, wavs at 44.1k/24-bit/stereo. <tspan class="annot-warn">research needed.</tspan></text>
    <text x="16" y="272" class="box-sub">  koala (all): flat .koala folder + koala.json. <tspan class="annot-warn">research needed.</tspan></text>
    <text x="16" y="296" class="annot-ok">→ see 07_device_matrix for the full grid + status colors.</text>
  </g>

  <!-- arrows from spine downward -->
  <path d="M 360 192 L 360 220" stroke="#3a85ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1024 192 L 1024 220" stroke="#3a85ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- phase 1 → 2 -->
  <path d="M 360 370 L 360 390" stroke="#3a85ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- phase 2 → 3 -->
  <path d="M 360 656 L 360 680" stroke="#3a85ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- phase 1 → 4 (cross-link) -->
  <path d="M 678 320 L 700 320" stroke="#999999" stroke-width="1" fill="none" marker-end="url(#arrow-muted)" stroke-dasharray="4 3"/>
  <!-- phase 4 → 5 -->
  <path d="M 1024 486 L 1024 510" stroke="#3a85ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
