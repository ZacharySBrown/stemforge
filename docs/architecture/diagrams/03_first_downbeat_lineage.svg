<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" text-rendering="optimizeLegibility" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a85ff"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e85d3a"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3aaa6e"/>
    </marker>
  </defs>

  <rect width="1400" height="720" fill="#fafaf7"/>

  <!-- title + caption -->
  <text x="40" y="50" font-size="28" font-weight="600" fill="#1a1a1a">first-downbeat lineage</text>
  <text x="40" y="76" font-size="14" fill="#666666">"where is bar 1?" — auto-detection finds the right grid; only the user picks which bar is musically first.</text>

  <!-- column headers -->
  <text x="60" y="120" font-size="13" font-weight="600" fill="#666666">auto-detection chain</text>
  <text x="930" y="120" font-size="13" font-weight="600" fill="#666666">override + iteration loop</text>

  <!-- ───────────── auto chain (4 steps left → right, single row) ───────────── -->

  <!-- step 1 -->
  <rect x="40" y="148" width="200" height="120" rx="12" fill="#f0efe9" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="60" y="174" font-size="13" font-weight="600" fill="#1a1a1a">1. beat-this raw</text>
  <text x="60" y="194" font-size="12" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">downbeats[]</text>
  <text x="60" y="212" font-size="12" fill="#1a1a1a">first entries can be</text>
  <text x="60" y="228" font-size="12" fill="#1a1a1a">phantom intro hits</text>
  <text x="60" y="250" font-size="11" font-family="IBM Plex Mono, Menlo, monospace" fill="#e85d3a">[1.82, 2.5, 3.78, 6.4]</text>

  <!-- step 2 -->
  <rect x="280" y="148" width="200" height="120" rx="12" fill="#dcf2e4" stroke="#3aaa6e" stroke-width="2"/>
  <text x="300" y="174" font-size="13" font-weight="600" fill="#1a1a1a">2. mode-walk filter</text>
  <text x="300" y="194" font-size="12" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">_first_stable_downbeat</text>
  <text x="300" y="212" font-size="12" fill="#1a1a1a">first downbeat whose ibi</text>
  <text x="300" y="228" font-size="12" fill="#1a1a1a">to next is within ±5%</text>
  <text x="300" y="244" font-size="12" fill="#1a1a1a">of bar period</text>
  <text x="300" y="262" font-size="11" fill="#3aaa6e" font-style="italic">trims phantoms</text>

  <!-- step 3 -->
  <rect x="520" y="148" width="200" height="120" rx="12" fill="#fafaf7" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="174" font-size="13" font-weight="600" fill="#1a1a1a">3. whole-beat align</text>
  <text x="540" y="192" font-size="11" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">find_best_downbeat_offset</text>
  <text x="540" y="212" font-size="12" fill="#1a1a1a">try offsets {0, 1, 2, 3}</text>
  <text x="540" y="228" font-size="12" fill="#1a1a1a">pick max kick-band</text>
  <text x="540" y="244" font-size="12" fill="#1a1a1a">onset energy at bar starts</text>
  <text x="540" y="262" font-size="11" fill="#666666" font-style="italic">(legacy librosa-era helper)</text>

  <!-- step 4 -->
  <rect x="760" y="148" width="200" height="120" rx="12" fill="#ffe5dc" stroke="#e85d3a" stroke-width="1.5"/>
  <text x="780" y="174" font-size="13" font-weight="600" fill="#1a1a1a">4. sub-beat refine</text>
  <text x="780" y="192" font-size="11" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">refine_first_downbeat</text>
  <text x="780" y="212" font-size="12" fill="#1a1a1a">±2 beats, 5 ms step</text>
  <text x="780" y="228" font-size="12" fill="#1a1a1a">x-corr kick env vs comb</text>
  <text x="780" y="246" font-size="11" font-family="IBM Plex Mono, Menlo, monospace" fill="#3a85ff">--refine-downbeat</text>
  <text x="780" y="262" font-size="11" fill="#e85d3a" font-style="italic">opt-in: backbeat lock risk</text>

  <!-- arrows along the chain -->
  <path d="M240 208 L 280 208" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M480 208 L 520 208" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720 208 L 760 208" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- phase-mod aside -->
  <rect x="280" y="296" width="440" height="60" rx="12" fill="#fafaf7" stroke="#666666" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="300" y="318" font-size="12" font-weight="600" fill="#666666">phase-mod approach  (explored, abandoned)</text>
  <text x="300" y="336" font-size="11" fill="#666666">cumulative bar_period error makes phase drift unreliable</text>
  <text x="300" y="350" font-size="11" fill="#666666">on late downbeats; mode-walk only uses consecutive ibis</text>

  <!-- ───────────── auto-detection ceiling callout ───────────── -->
  <rect x="40" y="380" width="920" height="100" rx="12" fill="#ffe5dc" stroke="#e85d3a" stroke-width="2"/>
  <text x="60" y="408" font-size="15" font-weight="600" fill="#e85d3a">auto-detection ceiling</text>
  <text x="60" y="430" font-size="13" fill="#1a1a1a">the chain above gives a downbeat that lands on the correct bar grid — but not necessarily the song's musical bar 1.</text>
  <text x="60" y="450" font-size="13" fill="#1a1a1a">a track may open with a snare fill, a vocal pickup, an implied rest, or 22 s of intro. only a human can pick which</text>
  <text x="60" y="470" font-size="13" fill="#1a1a1a">grid-bar is musically first. step 4's refinement is precise but assumes the kick is on the downbeat — fails on those.</text>

  <!-- ───────────── empirical results panel (bottom-left) ───────────── -->
  <rect x="40" y="500" width="920" height="180" rx="12" fill="#fafaf7" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="60" y="528" font-size="14" font-weight="600" fill="#1a1a1a">empirical results  (test corpus, 2026-04 → 2026-05)</text>

  <text x="60" y="560" font-size="12" font-weight="600" fill="#3aaa6e">believer</text>
  <text x="160" y="560" font-size="12" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">auto chain (steps 1–3) — no override needed, picked correct bar 1.</text>

  <text x="60" y="588" font-size="12" font-weight="600" fill="#3a85ff">ooh la la</text>
  <text x="160" y="588" font-size="12" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">auto 0.02s → refine 0.105s (truth 0.10) — within 5 ms.</text>
  <text x="160" y="606" font-size="12" font-family="IBM Plex Mono, Menlo, monospace" fill="#666666">manual: --first-downbeat 22.59 after probe-loop iteration (start at v1).</text>

  <text x="60" y="634" font-size="12" font-weight="600" fill="#e85d3a">believer (refine on)</text>
  <text x="220" y="634" font-size="12" font-family="IBM Plex Mono, Menlo, monospace" fill="#666666">refinement locked onto the backbeat. opt-in only.</text>

  <text x="60" y="662" font-size="12" font-weight="600" fill="#e85d3a">definition</text>
  <text x="160" y="662" font-size="12" font-family="IBM Plex Mono, Menlo, monospace" fill="#666666">snare-fill intro fooled refine; manual --first-downbeat 12.2834 (main beat drop).</text>

  <!-- ───────────── override + iteration loop column (right) ───────────── -->

  <!-- probe_loop -->
  <rect x="1000" y="148" width="360" height="120" rx="12" fill="#dbeaff" stroke="#3a85ff" stroke-width="2"/>
  <text x="1020" y="174" font-size="13" font-weight="600" fill="#1a1a1a">tools/probe_loop.py</text>
  <text x="1020" y="194" font-size="12" fill="#1a1a1a">extract a 4-bar loop at candidate</text>
  <text x="1020" y="210" font-size="12" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">--bpm  --first-downbeat  --start-bar</text>
  <text x="1020" y="228" font-size="12" fill="#1a1a1a">drag .wav into ableton, ear-test seam.</text>
  <text x="1020" y="248" font-size="11" fill="#3a85ff" font-style="italic">iterate until loop is seamless and</text>
  <text x="1020" y="262" font-size="11" fill="#3a85ff" font-style="italic">kick is on bar 1.</text>

  <!-- find_first_drum_cut -->
  <rect x="1000" y="296" width="360" height="116" rx="12" fill="#f0efe9" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="1020" y="322" font-size="13" font-weight="600" fill="#1a1a1a">tools/find_first_drum_cut.py</text>
  <text x="1020" y="340" font-size="12" fill="#1a1a1a">score grid candidates by sum of</text>
  <text x="1020" y="356" font-size="12" fill="#1a1a1a">kick-onset strength at bar-1 positions</text>
  <text x="1020" y="378" font-size="12" font-weight="600" fill="#3aaa6e">main beat drop</text>
  <text x="1140" y="378" font-size="12" fill="#1a1a1a">highest bar-1 strength</text>
  <text x="1020" y="398" font-size="12" font-weight="600" fill="#3a85ff">first audible</text>
  <text x="1140" y="398" font-size="12" fill="#1a1a1a">first bar-1 above threshold</text>

  <!-- re-anchor -->
  <rect x="1000" y="440" width="360" height="116" rx="12" fill="#dcf2e4" stroke="#3aaa6e" stroke-width="2"/>
  <text x="1020" y="466" font-size="13" font-weight="600" fill="#1a1a1a">stemforge re-anchor</text>
  <text x="1020" y="486" font-size="12" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">--bpm X  --first-downbeat Y</text>
  <text x="1020" y="504" font-size="12" fill="#1a1a1a">rewrites prechop chunks +</text>
  <text x="1020" y="520" font-size="12" fill="#1a1a1a">prechop_manifest.json in ~2s</text>
  <text x="1020" y="540" font-size="11" fill="#3aaa6e" font-style="italic">demucs stems untouched; prior values</text>
  <text x="1020" y="554" font-size="11" fill="#3aaa6e" font-style="italic">stamped into provenance.warning</text>

  <!-- iteration loop arrows (probe ↔ ear-test) -->
  <path d="M1180 268 C 1190 280, 1190 286, 1180 296" fill="none" stroke="#3a85ff" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M1180 412 C 1190 422, 1190 430, 1180 440" fill="none" stroke="#3aaa6e" stroke-width="1.5" marker-end="url(#arrow-ok)"/>

  <!-- loop-back arrow probe -> probe -->
  <path d="M1000 220 C 970 220, 970 180, 1000 180" fill="none" stroke="#3a85ff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
  <text x="892" y="206" font-size="11" fill="#3a85ff" font-style="italic">tweak</text>

  <!-- override → cli arrow into auto chain -->
  <path d="M1000 510 C 970 510, 950 280, 920 230" fill="none" stroke="#3aaa6e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-ok)"/>
  <text x="930" y="500" font-size="11" fill="#3aaa6e" font-style="italic">user value wins;</text>
  <text x="930" y="514" font-size="11" fill="#3aaa6e" font-style="italic">re-anchor skips demucs.</text>

  <!-- bottom row: workflow summary band -->
  <rect x="1000" y="584" width="360" height="96" rx="12" fill="#fafaf7" stroke="#1a1a1a" stroke-width="1"/>
  <text x="1020" y="608" font-size="12" font-weight="600" fill="#666666">practical workflow</text>
  <text x="1020" y="628" font-size="11" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">stemforge split track.wav</text>
  <text x="1020" y="644" font-size="11" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">probe_loop.py track.wav --bpm X --fd Y</text>
  <text x="1020" y="660" font-size="11" font-family="IBM Plex Mono, Menlo, monospace" fill="#1a1a1a">stemforge re-anchor track --bpm X --fd Y</text>
  <text x="1020" y="676" font-size="11" fill="#3aaa6e" font-style="italic">~2s vs ~30s re-forge</text>
</svg>
